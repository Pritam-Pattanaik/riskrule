# Gitleaks config: https://github.com/gitleaks/gitleaks
title = "RiskRule gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholder-only files and generated artifacts"
paths = [
  '''server/\.env\.example''',
  '''package-lock\.json''',
  '''server/package-lock\.json''',
  '''server/prisma/generated/.*''',
]
