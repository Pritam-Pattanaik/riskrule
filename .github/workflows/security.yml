name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  regression-tests:
    name: Security regression tests + lint guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server deps
        run: npm --prefix server ci
      - name: Install root deps (eslint)
        run: npm ci --ignore-scripts
      - name: Security regression tests
        working-directory: server
        run: npm test
      - name: Lint guard - no hardcoded secret fallbacks
        run: npx eslint server/src tests --quiet --rule '{"no-console":"off"}' || (echo "::error::ESLint errors (including the hardcoded-secret guard)"; exit 1)
